<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Party Duel - Labirinto</title>

    <!-- Importiamo Google Blockly e il generatore JavaScript -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    
    <!-- ECCO LA RIGA MANCANTE: Importiamo Socket.IO -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
        }

        /* Area di Gioco (Sinistra) */
        #gameArea {
            flex: 1;
            background-color: #2c3e50;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 4px solid #34495e;
        }

        .maze-container {
            flex: 1;
            background: #ecf0f1;
            background-image: radial-gradient(#bdc3c7 1px, transparent 1px);
            background-size: 40px 40px; 
            position: relative;
            border: 4px solid #bdc3c7;
            border-radius: 8px;
            overflow: hidden;
        }

        .maze-title {
            position: absolute;
            top: 5px;
            left: 10px;
            font-weight: bold;
            color: #7f8c8d;
            font-size: 14px;
            z-index: 5;
        }

        .avatar {
            font-size: 35px;
            position: absolute;
            top: 60px;  
            left: 20px; 
            transition: all 0.4s ease-in-out; 
        }

        /* Editor Blockly (Destra) */
        #blocklyContainer {
            width: 50%;
            position: relative;
        }

        #blocklyDiv {
            width: 100%;
            height: 100%;
        }

        #btn-invia {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #27ae60;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #btn-invia:hover { background-color: #2ecc71; }
    </style>
</head>
<body>

    <div id="gameArea">
        <div id="maze-p1" class="maze-container">
            <div class="maze-title">IL TUO ROBOT 🤖</div>
            <div id="avatar-p1" class="avatar">🤖</div>
        </div>
        <div id="maze-p2" class="maze-container">
            <div class="maze-title">AVVERSARIO IN ATTESA 👾</div>
            <div id="avatar-p2" class="avatar">👾</div>
        </div>
    </div>

    <div id="blocklyContainer">
        <div id="blocklyDiv"></div>
        <button id="btn-invia" onclick="inviaCodice()">Inizia Corsa! 🏁</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
